# WYSS Website - Nginx Configuration
# Place this in your nginx.conf or site configuration file

server {
    listen 80;
    server_name wyss-sg.com www.wyss-sg.com;
    
    # Root directory
    root /var/www/wyss-sg.com;
    index index.html;
    
    # Hide .html extension
    # Try to serve file directly, then with .html, then 404
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    
    # Redirect .html URLs to extensionless (301 permanent redirect)
    if ($request_uri ~ ^/(.*)\.html$) {
        return 301 /$1;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 403 /403.html;
    error_page 500 502 503 504 /500.html;
    
    # Browser caching
    location ~* \.(jpg|jpeg|png|gif|svg|ico|css|js|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    location ~* \.html$ {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # HTTPS redirect (uncomment when SSL is configured)
    # if ($scheme != "https") {
    #     return 301 https://$server_name$request_uri;
    # }
}

